version: 1
deploy:
  steps:
    terraformOutput:
      after:
        - |
          RESP=$(curl -s -w "\n%{http_code}" -u "$ENV0_API_KEY:$ENV0_API_SECRET" \
            "https://api.env0.com/configuration?organizationId=$ENV0_ORGANIZATION_ID&environmentId=$ENV0_ENVIRONMENT_ID")
          CODE=$(echo "$RESP" | tail -n1)
          BODY=$(echo "$RESP" | sed '$d')
          echo "HTTP status: $CODE"
          echo "Top-level type: $(echo "$BODY" | jq -r 'type')"
          echo "Keys (if object): $(echo "$BODY" | jq -rc 'if type=="object" then keys else "n/a" end')"
          echo "API message (if any): $(echo "$BODY" | jq -rc 'if type=="object" then (.message // .error // "none") else "none" end')"
          echo "Config entries (name/scope/id only):"
          echo "$BODY" | jq -rc 'if type=="array" then .[] else (.configurationChanges // .data // empty)[]? end | {name, scope, id}' 2>/dev/null || echo "  (body is not a config list)"
