version: 1
deploy:
  steps:
    terraformOutput:
      after:
        - |
          echo "key length: ${#ENV0_API_KEY}"
          echo "secret length: ${#ENV0_API_SECRET}"
          KT=$(printf '%s' "$ENV0_API_KEY" | tr -d '[:space:]')
          ST=$(printf '%s' "$ENV0_API_SECRET" | tr -d '[:space:]')
          echo "key trimmed length:    ${#KT}"
          echo "secret trimmed length: ${#ST}"
          curl -s -o /dev/null -w "auth check (as stored): %{http_code}\n" \
            -u "$ENV0_API_KEY:$ENV0_API_SECRET" "https://api.env0.com/organizations"
          curl -s -o /dev/null -w "auth check (trimmed):   %{http_code}\n" \
            -u "$KT:$ST" "https://api.env0.com/organizations"
