version: 1
deploy:
  steps:
    terraformOutput:
      after:
        - |
          echo "=== Variant A: environmentId only ==="
          curl -s -u "$ENV0_API_KEY:$ENV0_API_SECRET" \
            "https://api.env0.com/configuration?environmentId=$ENV0_ENVIRONMENT_ID" \
            | jq -rc 'if type=="array" then (.[] | {name, scope, id}) else . end'
          echo "=== Variant B: org + environmentId ==="
          curl -s -u "$ENV0_API_KEY:$ENV0_API_SECRET" \
            "https://api.env0.com/configuration?organizationId=$ENV0_ORGANIZATION_ID&environmentId=$ENV0_ENVIRONMENT_ID" \
            | jq -rc 'if type=="array" then (.[] | {name, scope, id}) else . end'
